<style>
:root{
  --bg:#0b1030; --card:#172152; --card2:#0f1740; --line:#2e3d8a;
  --text:#ffffff; --muted:#aab6ea;
  --cyan:#22d3ee; --yellow:#fde047; --orange:#fb923c; --red:#ef4444; --green:#22c55e; --purple:#a78bfa; --pink:#f472b6;
  --display:'Lilita One','Arial Black',Impact,system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-weight:800;min-height:100%}
body{background:radial-gradient(circle at 50% -10%,#24359a 0%,var(--bg) 62%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;font-weight:900;cursor:pointer;border:0;color:inherit}
#app{max-width:600px;margin:0 auto;padding:12px 16px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.5px;margin:0}
h2{font-size:26px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center} .col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0} .wrap{flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);font-weight:700;line-height:1.4}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.logo{display:block;width:min(100%,400px);margin:0 auto}

.btn{display:block;width:100%;padding:15px 18px;border-radius:18px;font-size:19px;background:var(--card);border:2px solid var(--line);transition:transform .08s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;filter:grayscale(.6);transform:none;cursor:default}
.btn.primary{background:linear-gradient(180deg,#fde047,#f59e0b);color:#1a1300;border-color:#fff3;box-shadow:0 6px 0 #a16207}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 #a16207;transform:translateY(4px)}
.btn.cyan{background:linear-gradient(180deg,#67e8f9,#06b6d4);color:#03141a;border-color:#fff3;box-shadow:0 6px 0 #0e7490}
.btn.cyan:active:not(:disabled){box-shadow:0 2px 0 #0e7490;transform:translateY(4px)}
.btn.danger{background:#3b1220;border-color:#9f1239;color:#fecdd3}
.btn.ghost{background:transparent}
.btn.small{padding:9px 12px;font-size:15px;border-radius:12px;width:auto;display:inline-block}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 11px;font-size:16px;line-height:1.1}

label.lbl{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin:0 0 6px}
input.inp{width:100%;padding:14px 16px;font-size:20px;border-radius:14px;border:2px solid var(--line);background:#0b1236;color:#fff;font-family:inherit;font-weight:800;outline:none}
input.inp:focus{border-color:var(--cyan)}
input.code{text-transform:uppercase;letter-spacing:10px;text-align:center;font-family:var(--display);font-size:34px}

.tabs{display:flex;background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.tabs button{flex:1;padding:11px;border-radius:12px;background:transparent;font-size:18px;color:var(--muted)}
.tabs button.on{background:var(--cyan);color:#03141a}
.seg{display:flex;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;background:transparent;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--yellow);color:#1a1300}
.seg.ro button{cursor:default}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;background:#3a2a05;border:2px solid #a16207;color:#fde68a;line-height:1.4}
.banner.ok{background:#052e1b;border-color:#15803d;color:#bbf7d0}
.banner.warn{background:#3b1220;border-color:#9f1239;color:#fecdd3}
.banner code{background:#0006;padding:1px 5px;border-radius:5px}

.topbar{display:flex;align-items:center;gap:8px}
.tlogo{height:44px;width:auto;display:block}
.codechip{font-family:var(--display);letter-spacing:3px;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-size:16px}
.bigcode{font-family:var(--display);font-size:64px;letter-spacing:12px;color:var(--yellow);line-height:1;padding-left:12px}

.scores{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:6px;background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:14px;max-width:100%}
.pchip.me{border-color:var(--cyan)} .pchip.judge{border-color:var(--yellow)}
.pchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pchip b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--yellow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none} .dot.off{background:#64748b}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:18px}
.prow.me{border-color:var(--cyan)}
.x{background:#3b1220;border:2px solid #9f1239;color:#fecdd3;border-radius:10px;padding:5px 9px;font-size:13px}

.phase{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--cyan);text-align:center}
.question{font-family:var(--display);font-size:clamp(24px,6.4vw,34px);line-height:1.12;text-align:center;text-transform:uppercase;color:var(--yellow);text-shadow:0 3px 0 #0006;padding:4px 0}
.strangers{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.strangers{grid-template-columns:1fr 1fr}}
.st{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 14px;font-size:20px;position:relative;min-height:66px}
button.st:active{transform:scale(.98)}
.st .ltr{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#0b1030;background:var(--c)}
.st .nm{font-family:var(--display);font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.st .sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.st.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.st.win{border-color:var(--yellow);background:#4a3a06}
.st.dim{opacity:.45}
.st .tag{margin-left:auto;flex:none;font-size:12px;text-transform:uppercase;letter-spacing:1px;background:#0006;border-radius:8px;padding:4px 7px}
.st .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--c);border-radius:0 4px 4px 14px}
.scn{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;font-size:19px;line-height:1.3}
.scn.sel{border-color:var(--yellow);background:#4a3a06}
.timer{font-family:var(--display);font-size:30px;text-align:center;color:var(--cyan)} .timer.low{color:var(--red)}
.pill{display:inline-block;white-space:nowrap;background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}

table.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:6px 4px;vertical-align:bottom;line-height:1.2}
.tbl td{padding:9px 4px;overflow-wrap:anywhere;border-top:2px solid var(--line)}
.tbl .n{text-align:center;font-family:var(--display);font-size:18px}
.tbl th.n{font-family:var(--body);font-size:10px;width:17%}
.tbl tr.top td{color:var(--yellow)}
.ok{color:var(--green)} .no{color:#f87171}
.winner{font-family:var(--display);font-size:clamp(30px,9vw,46px);color:var(--yellow);text-align:center;line-height:1.05;text-shadow:0 4px 0 #0006}

.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#0b1030;padding:12px 18px;border-radius:14px;font-size:16px;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 30px #0008}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
ol.how{margin:0;padding-left:20px;color:var(--muted);font-weight:700;line-height:1.5;font-size:15px}
ol.how b{color:#fff}
summary{cursor:pointer;font-size:17px}
@media (prefers-reduced-motion:reduce){.pop,.confetti i{animation:none}}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const rid = (n = 12) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : x ? Object.values(x) : [];
const store = {
  get(k, d, s) { try { const v = (s || localStorage).getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v, s) { try { (s || localStorage).setItem(k, JSON.stringify(v)); } catch {} },
  del(k, s) { try { (s || localStorage).removeItem(k); } catch {} }
};
const SS = () => { try { return sessionStorage; } catch { return null; } };
const sess = { get: (k, d) => SS() ? store.get(k, d, SS()) : d, set: (k, v) => { if (SS()) store.set(k, v, SS()); }, del: k => { if (SS()) store.del(k, SS()); } };

async function makeFirebaseBackend() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]);
  const [{ initializeApp }, D] = await withTimeout(Promise.all([import(base + "firebase-app.js"), import(base + "firebase-database.js")]), 6000);
  const app = initializeApp(firebaseConfig);
  const db = D.getDatabase(app);
  let offset = 0;
  D.onValue(D.ref(db, ".info/serverTimeOffset"), s => offset = s.val() || 0);
  const connected = { v: false, cbs: [] };
  D.onValue(D.ref(db, ".info/connected"), s => { connected.v = !!s.val(); connected.cbs.forEach(f => f(connected.v)); });
  const r = p => D.ref(db, p);
  return {
    kind: "firebase",
    now: () => Date.now() + offset,
    get: async p => (await D.get(r(p))).val(),
    set: (p, v) => D.set(r(p), v),
    update: (p, v) => D.update(r(p), v),
    remove: p => D.remove(r(p)),
    on(p, cb) { return D.onValue(r(p), s => cb(s.val())); },
    async transact(p, fn) { // a null first read means "not cached yet": hand it back so Firebase retries with the server's value
      let ran = false;
      const res = await D.runTransaction(r(p), cur => { if (cur == null) return cur; const v = fn(cur); ran = v !== undefined; return v; }, { applyLocally: false });
      return res.committed && ran;
    },
    presence(p) {
      const set = v => { if (v) { D.set(r(p), true); D.onDisconnect(r(p)).set(false); } };
      connected.cbs.push(set); set(connected.v);
      return () => { connected.cbs = connected.cbs.filter(f => f !== set); try { D.onDisconnect(r(p)).cancel(); } catch {} };
    },
    onConn(cb) { connected.cbs.push(cb); cb(connected.v); }
  };
}

function makeLocalBackend() {
  // Tree kept in localStorage and announced over BroadcastChannel so several tabs on one device can play together.

  return `<${tag} class="st ${o.cls || ""}" style="--c:${col(i)}" ${o.attr || ""} ${o.disabled ? "disabled" : ""}>
    <span class="ltr">${LETTERS[i]}</span>
    <span class="grow"><span class="nm">${esc(name)}</span>${o.sub ? `<div class="sub">${o.sub}</div>` : ""}</span>
    ${o.tag ? `<span class="tag">${o.tag}</span>` : ""}${o.bar != null ? `<span class="bar" style="width:${o.bar}%"></span>` : ""}
  </${tag}>`;
}
const timerHtml = () => st().endsAt ? `<div class="timer" id="tm"></div>` : "";
const confirmBtn = (act, label, cls = "", extra = "") => `<button class="btn ${cls}" data-act="${act}" data-confirm="1" ${extra}>${S.ui.confirm === act ? "Tap again to confirm" : label}</button>`;
const hostOnly = html => isHost() ? html : "";
const waitingHost = what => isHost() ? "" : `<p class="center hint">Waiting for ${esc(pname(R().hostId))} (Host) to ${what}…</p>`;

function topbar() {
  const s = st();
  const lbl = s.phase === "lobby" ? "Lobby" : ROUND_PH.includes(s.phase) ? `Round ${active(s).indexOf(s.judge) + 1} of ${active(s).length}` : inFS(s) ? "Final Showdown" : "Results";
  return `<div class="topbar"><img class="tlogo" src="${LOGO}" alt="What's Their Story?"><span class="grow"></span><span class="pill">${lbl}</span><span class="codechip">${esc(S.code)}</span><button class="iconbtn" data-act="menu" aria-label="Menu">☰</button></div>`;
}
function scoreStrip() {
  const s = st(), rows = active(s).map(id => ({ id, t: total((s.sc || {})[id]) })).sort((a, b) => b.t - a.t);
  return `<div class="scores">${rows.map(r => `<span class="pchip ${r.id === S.pid ? "me" : ""} ${ROUND_PH.includes(s.phase) && r.id === s.judge ? "judge" : ""}"><span class="dot ${online(r.id) ? "" : "off"}"></span><span class="nm">${ROUND_PH.includes(s.phase) && r.id === s.judge ? "⚖️ " : ""}${esc(pname(r.id))}</span><b>${r.t}</b></span>`).join("")}</div>`;
}
function alerts() {
  const out = [];
  if (judgeAway()) out.push(`<div class="banner warn">⏸ <b>${esc(pname(st().judge))} (the Judge) is disconnected.</b> The round is paused until they return${isHost() ? " — or restart the round from the ☰ menu." : " or the Host restarts the round."}</div>`);
  if (!online(R().hostId) && !isHost()) out.push(`<div class="banner warn">The Host (${esc(pname(R().hostId))}) is disconnected. <button class="btn small" style="margin-top:6px" data-act="takeHost" data-confirm="1">${S.ui.confirm === "takeHost" ? "Tap again to confirm" : "Take over as Host"}</button></div>`);
  return out.join("");
}

function renderHome() {
  const last = S.urlRoom || sess.get("wts_session")?.code || store.get("wts_last", ""), tab = S.tab, name = esc(S.booting ? "" : pidStore().get("wts_name", ""));
  const mode = S.booting ? `<div class="banner">⏳ Connecting…</div>` : S.be.kind === "local"
    ? `<div class="banner">🧪 <b>Offline demo mode</b> — the game server can't be reached from here, so rooms sync only between tabs on this device. Open this page in ${MIN_P} tabs to try a full game. Host <code>index.html</code> (e.g. on GitHub Pages) for real phone-to-phone play.</div>`
    : `<div id="connBanner" class="banner ${S.conn ? "ok" : ""}">${connText()}</div>`;
  return `
    <img class="logo" src="${LOGO}" alt="What's Their Story?">
    <p class="center muted" style="font-size:17px">Four strangers. One ridiculous question. Guess who the Judge picked.<br>3–6 players · no app or account needed.</p>
    <div class="tabs"><button class="${tab === "join" ? "on" : ""}" data-tab="join">Join</button><button class="${tab === "host" ? "on" : ""}" data-tab="host">Host</button></div>
    <div class="card">
    ${tab === "join" ? `
      <form id="joinForm" class="col">
        <div><label class="lbl" for="jCode">Room code</label><input id="jCode" class="inp code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(last || "")}" required></div>
        <div><label class="lbl" for="jName">Display name</label><input id="jName" class="inp" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${name}" required></div>
        <button class="btn primary" type="submit" ${S.booting ? "disabled" : ""}>Join Game</button>
      </form>` : `
      <form id="hostForm" class="col">
        <div><label class="lbl" for="hName">Display name</label><input id="hName" class="inp" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${name}" required></div>
        <button class="btn primary" type="submit" ${S.booting ? "disabled" : ""}>Create Game Room</button>
        <p class="hint">You'll be the Host: you pick the settings, start the game and move it along. You play too.</p>
      </form>`}
    </div>
    <details class="card"><summary>How to play</summary><div style="margin-top:10px">${howTo()}</div></details>
    ${mode}`;
}
const connText = () => S.conn ? "🟢 Online — rooms sync live between phones." : "⏳ Connecting to the game server… If this never turns green, check the Firebase databaseURL and Realtime Database rules.";
function howTo() {
  return `<ol class="how">
    <li>Each round, four <b>strangers</b> appear — just names. No pictures, no bios. Who they are is up to you.</li>
    <li>One player is the <b>Judge</b>. The Judge privately picks one of two scenarios, then secretly locks in the stranger who fits it best.</li>
    <li>The scenario is revealed. Everyone argues, invents backstories and tries to work out <b>who the Judge picked</b> — not who fits best.</li>
    <li>Everyone except the Judge votes in secret. Once submitted, a vote can't be changed.</li>
    <li><b>Scoring:</b> 1 point for each correct guess. The Judge gets 1 point for every player who guessed right.</li>
    <li>The Judge's pick becomes their <b>Finalist</b>. Everybody is Judge exactly once.</li>
    <li><b>Final Showdown:</b> all Finalists face one new scenario. Vote for the best fit — but not your own. The owner of the winning Finalist gets <b>${BONUS} bonus points</b>. Ties go to a tiebreaker scenario (up to ${MAX_TIEBREAKS}, then the bonus is shared).</li>
    <li>Most points wins. Tied? Most correct guesses, then most Judge points, then a shared victory.</li></ol>`;
}

function vLobby() {
  const c = cfg(), host = isHost(), ps = Object.entries(players()).sort((a, b) => a[1].joinedAt - b[1].joinedAt), n = ps.length;
  const seg = (key, opts) => `<div class="seg ${host ? "" : "ro"}">${opts.map(([v, l]) => `<button ${host ? `data-set="${key}" data-val='${JSON.stringify(v)}'` : "disabled"} class="${c[key] === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const url = location.href.split("#")[0].split("?")[0], link = url + "?room=" + S.code, fb = S.be.kind === "firebase";
  return `
    <div class="card center col" style="gap:8px">
      <div class="muted" style="font-size:13px;letter-spacing:2px">ROOM CODE</div>
      <div class="bigcode">${esc(S.code)}</div>
      ${fb ? `<div class="hint" style="word-break:break-all">Invite link: <b style="color:#fff">${esc(link)}</b></div>
      <div><button class="btn small" data-act="copy" data-copy="${esc(link)}">📋 Copy invite link</button></div>`
      : `<div class="hint">Demo mode: open this same page in another tab and join with this code.</div>`}
    </div>
    <div class="card col">
      <div class="row"><h3 class="grow">Players</h3><span class="pill">${n} / ${MAX_P}</span></div>
      <div class="plist">${ps.map(([id, p]) => `<div class="prow ${id === S.pid ? "me" : ""}"><span class="dot ${p.online === false ? "off" : ""}"></span><span class="grow">${esc(p.name)}${id === R().hostId ? " 👑" : ""}${id === S.pid ? ` <span class="muted" style="font-size:13px">(you)</span>` : ""}</span>${host && id !== S.pid ? `<button class="x" data-act="kick" data-id="${id}" data-confirm="1">${S.ui.confirm === "kick" + id ? "Sure?" : "Remove"}</button>` : ""}</div>`).join("")}</div>
      ${n < MIN_P ? `<p class="hint">Need ${MIN_P - n} more player${MIN_P - n > 1 ? "s" : ""} to start (3–6 players).</p>` : ""}
    </div>
    <div class="card col">
      <h3>Settings${host ? "" : ` <span class="muted" style="font-size:13px;font-family:var(--body)">(Host decides)</span>`}</h3>
      <div><label class="lbl">Content rating</label>${seg("rating", [["G", "General"], ["T", "Teen"], ["A", "Adult"]])}
        <p class="hint" style="margin-top:6px">${c.rating === "G" ? "Family-friendly scenarios only." : c.rating === "T" ? "Adds cheekier, mildly rude scenarios." : "Adds adult humor: drinking, dating disasters and innuendo."}</p></div>
      <div><label class="lbl">Discussion</label>${seg("discuss", [[0, "Untimed"], [60, "1 min"], [120, "2 min"], [180, "3 min"]])}</div>
      <div><label class="lbl">Voting timer</label>${seg("vote", [[0, "Off"], [30, "30 sec"], [60, "60 sec"]])}
        <p class="hint" style="margin-top:6px">${c.vote ? "Anyone who hasn't voted when time runs out scores 0 for that round." : "Voting stays open until everyone has voted."}</p></div>
    </div>
    ${host ? `<button class="btn primary" data-act="start" ${n < MIN_P || n > MAX_P ? "disabled" : ""}>Start Game</button>` : `<p class="center hint">Waiting for ${esc(pname(R().hostId))} to start the game…</p>`}`;
}

function vJudge() {
  const s = st(), names = arr(s.strangers), me = s.judge === S.pid, u = S.ui, m = S.mine;
  if (!me) return `
    <div class="phase">Meet the strangers</div>
    <h2 class="center">⚖️ ${esc(pname(s.judge))} is the Judge</h2>
    <p class="center hint">${esc(pname(s.judge))} is secretly choosing a scenario and the stranger who fits it. Start imagining who these people are…</p>
    <div class="strangers">${names.map((n, i) => stranger(i, n)).join("")}</div>`;
  const opts = m.opts;
  return `
    <div class="phase">You are the Judge ⚖️</div>
    <h2 class="center">1 · Choose a scenario</h2>
    <p class="center hint">Only you can see these. The one you don't pick is thrown away.</p>
    ${opts ? opts.map((qi, i) => `<button class="scn ${u.sc === i ? "sel" : ""}" data-act="pickSc" data-i="${i}">${esc(DATA.sc[qi][2])}</button>`).join("") : `<p class="center muted">Dealing scenarios…</p>`}
    <h2 class="center" style="margin-top:6px">2 · Who fits it best?</h2>
    <div class="strangers">${names.map((n, i) => stranger(i, n, { btn: true, cls: u.pick === i ? "sel" : "", attr: `data-act="pickSt" data-i="${i}"`, disabled: u.sc == null })).join("")}</div>
    ${confirmBtn("lock", u.pick != null ? `🔒 Lock in ${esc(names[u.pick])}` : "🔒 Lock in your answer", "primary", u.sc == null || u.pick == null ? "disabled" : "")}
    <p class="center hint">Once locked, your answer can't be changed.</p>`;
}
function judgeNote() {
  const s = st(), m = S.mine, names = arr(s.strangers);
  if (s.judge !== S.pid) return "";
  return `<div class="card center col" style="gap:8px"><div>🔒 Your answer is locked. Join the debate — just don't give it away!</div>
    <button class="btn small" style="align-self:center" data-act="peek">${S.ui.peek ? `Your pick: ${m.pick != null ? esc(names[m.pick]) : "…"} (tap to hide)` : "👁 Peek at my pick"}</button></div>`;
}
function vDiscuss() {
  const s = st(), names = arr(s.strangers);
  return `
    <div class="phase">Discussion · who did ${esc(pname(s.judge))} pick?</div>
    <div class="question pop">${esc(s.q)}</div>
    ${timerHtml()}
    <div class="strangers">${names.map((n, i) => stranger(i, n)).join("")}</div>
    ${judgeNote()}
    <p class="center hint">Invent their careers, habits and secrets. The goal isn't who truly fits — it's predicting the Judge.</p>
    ${hostOnly(`<button class="btn primary" data-act="startVote" ${judgeAway() ? "disabled" : ""}>Start Voting</button>${s.endsAt ? `<button class="btn" data-act="addTime">+30 seconds</button>` : ""}`)}
    ${waitingHost("start the vote")}`;
}
function votedCount() { const s = st(), v = voters(s); return `<p class="center"><span class="pill">🗳 ${v.filter(id => (s.voted || {})[id]).length} of ${v.length} votes in</span></p>`; }
function forceReveal() {
  const s = st(), missing = voters(s).filter(id => !(s.voted || {})[id]);
  if (!isHost() || !missing.length || judgeAway()) return "";
  return `<div class="col" style="gap:6px">${confirmBtn("force", "Close voting now", "")}<p class="center hint">Still waiting on ${missing.map(id => esc(pname(id))).join(", ")}. Closing now gives them no points this round.</p></div>`;
}
function vVote() {
  const s = st(), names = arr(s.strangers), u = S.ui, m = S.mine, me = s.judge === S.pid, done = (s.voted || {})[S.pid];
  const head = `<div class="phase">Secret vote</div><div class="question">${esc(s.q)}</div>${timerHtml()}`;
  if (me) return `${head}<div class="strangers">${names.map((n, i) => stranger(i, n)).join("")}</div>${judgeNote()}${votedCount()}<p class="center hint">The Judge doesn't vote. Sit back and look innocent.</p>${forceReveal()}`;
  if (done) return `${head}<div class="strangers">${names.map((n, i) => stranger(i, n, { cls: m.vote === i ? "sel" : "dim", tag: m.vote === i ? "🔒 your vote" : "" })).join("")}</div>${votedCount()}<p class="center hint">Vote locked. Waiting for the others…</p>${forceReveal()}`;
  return `${head}
    <p class="center hint">Which stranger did ${esc(pname(s.judge))} pick? You can change your mind until you submit.</p>
    <div class="strangers">${names.map((n, i) => stranger(i, n, { btn: true, cls: u.vote === i ? "sel" : "", attr: `data-act="selVote" data-v="${i}"` })).join("")}</div>
    <button class="btn primary" data-act="submitVote" ${u.vote == null ? "disabled" : ""}>${u.vote != null ? `Submit vote: ${esc(names[u.vote])}` : "Submit vote"}</button>
    ${votedCount()}${forceReveal()}`;
}
function finalistList() {
  const s = st(), fin = s.fin || {}, ids = active(s).filter(id => fin[id]);
  if (!ids.length) return "";
  return `<div class="card col" style="gap:8px"><h3>Finalists so far</h3>${ids.map(id => `<div class="row" style="font-size:16px"><span class="grow">${esc(fin[id])}</span><span class="muted">${esc(pname(id))}</span></div>`).join("")}</div>`;
}
function vReveal() {
  const s = st(), names = arr(s.strangers), res = s.res || {}, votes = res.votes || {}, pick = res.pick, c = res.correct || 0;
  const order = arr(s.order), more = order.slice(s.ji + 1).some(id => !(s.gone || {})[id]);
  const ids = active(s).filter(id => id !== s.judge);
  return `
    <div class="phase">The answer</div>
    <div class="question" style="font-size:20px">${esc(s.q)}</div>
    <h2 class="center">${esc(pname(s.judge))} picked…</h2>
    <div class="strangers pop">${names.map((n, i) => stranger(i, n, { cls: i === pick ? "win" : "dim", tag: i === pick ? "⚖️ Judge's pick" : "", sub: ids.filter(id => votes[id] === i).map(id => esc(pname(id))).join(", ") })).join("")}</div>
    <div class="card"><table class="tbl"><tr><th>Player</th><th>Guess</th><th>Result</th><th class="n">Pts</th></tr>
      ${ids.map(id => { const v = votes[id] ?? -1, ok = v === pick; return `<tr><td>${esc(pname(id))}</td><td>${v >= 0 ? esc(names[v]) : `<span class="muted">No vote</span>`}</td><td class="${ok ? "ok" : "no"}">${ok ? "✓ Correct" : "✗ Incorrect"}</td><td class="n">${ok ? "+1" : "0"}</td></tr>`; }).join("")}
      <tr><td>⚖️ ${esc(pname(s.judge))}</td><td colspan="2" class="muted">Judge · ${c} correct guess${c === 1 ? "" : "es"}</td><td class="n">+${c}</td></tr></table>
      ${c === 0 ? `<p class="hint" style="margin-top:8px">Nobody guessed correctly, so nobody scores this round.</p>` : ""}</div>
    <div class="banner ok">⭐ <b>${esc(names[pick])}</b> is now ${esc(pname(s.judge))}'s Finalist. The other three strangers are gone for good.</div>
    ${finalistList()}
    ${hostOnly(`<button class="btn primary" data-act="next">${more ? "Next Round" : "Start the Final Showdown"}</button>`)}
    ${waitingHost(more ? "start the next round" : "start the Final Showdown")}`;
}

function fsHead() {
  const fs = st().fs || {};
  return `<div class="phase">${fs.t ? `Tiebreaker ${fs.t} of ${MAX_TIEBREAKS}` : "🏆 The Final Showdown"}</div><div class="question ${st().phase === "fs_discuss" ? "pop" : ""}">${esc(fs.q)}</div>`;
}
function fsCard(id, i, o = {}) { const mine = id === S.pid; return stranger(i, (st().fin || {})[id] || "?", { ...o, sub: `${esc(pname(id))}'s Finalist${mine ? " · yours" : ""}` + (o.sub || "") }); }
function vFsDiscuss() {
  const s = st(), cands = arr(s.fs.cands);
  return `${fsHead()}${timerHtml()}
    <div class="strangers">${cands.map((id, i) => fsCard(id, i)).join("")}</div>
    <p class="center hint">${s.fs.t ? "Only the tied Finalists remain. " : ""}Which Finalist fits best? Make your case — you won't be able to vote for your own. The winner's owner gets ${BONUS} bonus points.</p>
    ${hostOnly(`<button class="btn primary" data-act="startVote">Start Voting</button>${s.endsAt ? `<button class="btn" data-act="addTime">+30 seconds</button>` : ""}`)}
    ${waitingHost("start the vote")}`;
}
function vFsVote() {
  const s = st(), cands = arr(s.fs.cands), u = S.ui, m = S.mine, done = (s.voted || {})[S.pid], can = voters(s).includes(S.pid);
  if (!can) return `${fsHead()}${timerHtml()}<div class="strangers">${cands.map((id, i) => fsCard(id, i)).join("")}</div>${votedCount()}<p class="center hint">Your own Finalist is the only choice left, so you sit this vote out.</p>${forceReveal()}`;
  if (done) return `${fsHead()}${timerHtml()}<div class="strangers">${cands.map((id, i) => fsCard(id, i, { cls: m.vote === id ? "sel" : "dim", tag: m.vote === id ? "🔒 your vote" : "" })).join("")}</div>${votedCount()}<p class="center hint">Vote locked. Waiting for the others…</p>${forceReveal()}`;
  return `${fsHead()}${timerHtml()}
    <p class="center hint">Vote for the Finalist who fits best. You can't vote for your own.</p>
    <div class="strangers">${cands.map((id, i) => fsCard(id, i, id === S.pid ? { cls: "dim", tag: "yours" } : { btn: true, cls: u.vote === id ? "sel" : "", attr: `data-act="selVote" data-v="${id}"` })).join("")}</div>
    <button class="btn primary" data-act="submitVote" ${u.vote == null ? "disabled" : ""}>${u.vote != null ? `Submit vote: ${esc((s.fin || {})[u.vote])}` : "Submit vote"}</button>
    ${votedCount()}${forceReveal()}`;
}
function vFsReveal() {
  const s = st(), fs = s.fs, cands = arr(fs.cands), tally = fs.tally || {}, votes = fs.votes || {}, win = arr(fs.win), tie = arr(fs.tie);
  const max = Math.max(1, ...cands.map(c => tally[c] || 0)), fin = s.fin || {};
  const cards = cands.map((id, i) => fsCard(id, i, { cls: win.includes(id) ? "win" : tie.includes(id) ? "" : "dim", tag: `${tally[id] || 0} vote${tally[id] === 1 ? "" : "s"}`, bar: (tally[id] || 0) / max * 100, sub: (() => { const v = Object.keys(votes).filter(x => votes[x] === id).map(x => esc(pname(x))); return v.length ? `<br>Voted by ${v.join(", ")}` : ""; })() })).join("");
  let msg;
  if (win.length === 1) msg = `<div class="winner pop">${esc(fin[win[0]])} wins the showdown!</div><div class="banner ok center">+${BONUS} bonus points to <b>${esc(pname(win[0]))}</b></div>`;
  else if (win.length > 1) msg = `<div class="winner pop">Joint showdown winners!</div><div class="banner ok center">Still tied after ${MAX_TIEBREAKS} tiebreakers. ${win.map(id => `<b>${esc(fin[id])}</b>`).join(" and ")} share the win — +${BONUS} bonus points each to ${win.map(id => `<b>${esc(pname(id))}</b>`).join(", ")}.</div>`;
  else msg = `<div class="winner pop">It's a tie!</div><div class="banner center">${tie.map(id => `<b>${esc(fin[id])}</b>`).join(", ")} are tied on ${tally[tie[0]] || 0} vote${tally[tie[0]] === 1 ? "" : "s"}. Tiebreaker ${(fs.t || 0) + 1} of ${MAX_TIEBREAKS}: a new scenario, tied Finalists only.</div>`;
  return `<div class="phase">${fs.t ? `Tiebreaker ${fs.t} result` : "Showdown result"}</div><div class="question" style="font-size:20px">${esc(fs.q)}</div>
    ${msg}<div class="strangers">${cards}</div>
    ${hostOnly(`<button class="btn primary" data-act="next">${win.length ? "See Final Results" : "Start Tiebreaker"}</button>`)}
    ${waitingHost(win.length ? "show the final results" : "start the tiebreaker")}`;
}
function vFinal() {
  const s = st(), S_ = standings(s), fs = s.fs || {}, win = arr(fs.win), fin = s.fin || {};
  const names = S_.winners.map(id => esc(pname(id)));
  const why = !S_.tiedOnPoints ? "" : S_.winners.length > 1 ? "Tied on points, correct guesses and Judge points — a shared victory." : S_.by === "correct" ? "Tied on points — decided by most correct guesses." : "Tied on points and correct guesses — decided by most Judge points.";
  return `
    <div class="phase">Final results</div>
    <div class="winner pop">🏆 ${names.length > 1 ? names.join(" & ") + " win!" : names[0] + " wins!"}</div>
    ${why ? `<p class="center hint">${why}</p>` : ""}
    <div class="card"><table class="tbl"><tr><th>Player</th><th class="n">Total</th><th class="n">Correct guesses</th><th class="n">Judge pts</th><th class="n">Show&shy;down</th></tr>
      ${S_.rows.map(r => `<tr class="${S_.winners.includes(r.id) ? "top" : ""}"><td>${S_.winners.includes(r.id) ? "🏆 " : ""}${esc(pname(r.id))}</td><td class="n">${r.total}</td><td class="n">${r.g}</td><td class="n">${r.j}</td><td class="n">${r.b ? "+" + r.b : "–"}</td></tr>`).join("")}</table></div>
    <div class="card col" style="gap:8px"><h3>Final Showdown</h3>
      ${fs.skipped ? `<p class="hint">Not enough Finalists were left for a showdown.</p>` : `<p class="hint">${win.length > 1 ? `Joint winners after ${MAX_TIEBREAKS} tiebreakers` : `Winner${fs.t ? ` after ${fs.t} tiebreaker${fs.t > 1 ? "s" : ""}` : ""}`}: ${win.map(id => `<b style="color:#fff">${esc(fin[id])}</b> (${esc(pname(id))}, +${BONUS})`).join(" and ")}</p>`}
      ${active(s).filter(id => fin[id]).map(id => `<div class="row" style="font-size:16px"><span class="grow">${win.includes(id) ? "⭐ " : ""}${esc(fin[id])}</span><span class="muted">${esc(pname(id))}</span></div>`).join("")}
    </div>
    ${hostOnly(`<button class="btn primary" data-act="start">Play Again</button><button class="btn" data-act="toLobby">Back to lobby (change settings or players)</button>`)}
    ${waitingHost("start a new game")}`;
}

function sheetHtml() {
  if (!S.sheet) return "";
  const s = st(), host = isHost(), inGame = s.phase !== "lobby";
  let body = "";
  if (S.sheet === "how") body = `<div class="row"><h2 class="grow">How to play</h2><button class="iconbtn" data-act="closeSheet">✕</button></div>${howTo()}`;
  else {
    const ids = inGame ? active(s) : Object.keys(players());
    body = `<div class="row"><h2 class="grow">Room ${esc(S.code)}</h2><button class="iconbtn" data-act="closeSheet">✕</button></div>
      <div class="plist">${ids.map(id => `<div class="prow ${id === S.pid ? "me" : ""}"><span class="dot ${online(id) ? "" : "off"}"></span><span class="grow">${esc(pname(id))}${id === R().hostId ? " 👑" : ""}${!online(id) ? ` <span class="muted" style="font-size:13px">disconnected</span>` : ""}</span>${inGame ? `<b class="disp" style="color:var(--yellow)">${total((s.sc || {})[id])}</b>` : ""}${host && id !== S.pid ? `<button class="x" data-act="kick" data-id="${id}" data-confirm="1">${S.ui.confirm === "kick" + id ? "Sure?" : "Remove"}</button>` : ""}</div>`).join("")}</div>
      <button class="btn" data-act="how">How to play</button>
      <button class="btn" data-act="mute">${Snd.muted ? "🔇 Sound is off" : "🔊 Sound is on"}</button>
      ${host && ["judge", "discuss", "vote"].includes(s.phase) ? confirmBtn("restartRound", "↺ Restart this round (new strangers, same Judge)") : ""}
      ${confirmBtn("leave", "Leave room")}
      ${host ? confirmBtn("endSession", "End session for everyone", "danger") : ""}
      <p class="hint">${inGame ? "If you get disconnected, reopen the page — your seat, score and any vote you already submitted are kept." : ""}</p>`;
  }
  return `<div class="sheet" data-act="closeSheet"><div class="panel col" data-stop="1">${body}</div></div>`;
}

function render() {
  const app = $("#app");
  if (!S.code) { app.innerHTML = renderHome(); return; }
  if (!S.room) { app.innerHTML = `<p class="center muted" style="margin-top:40px">Joining room ${esc(S.code)}…</p>`; return; }
  const s = st(), v = { lobby: vLobby, judge: vJudge, discuss: vDiscuss, vote: vVote, reveal: vReveal, fs_discuss: vFsDiscuss, fs_vote: vFsVote, fs_reveal: vFsReveal, final: vFinal }[s.phase] || vLobby;
  app.innerHTML = topbar() + (s.phase !== "lobby" && s.phase !== "final" ? scoreStrip() : "") + alerts() + v() + sheetHtml();
  tick();
}

// =====================================================================
//  EVENTS
// =====================================================================
function needConfirm(t, key) { // two-tap confirmation (browser dialogs don't work everywhere)
  if (S.ui.confirm === key) { S.ui.confirm = null; return false; }
  S.ui.confirm = key; clearTimeout(needConfirm.t); needConfirm.t = setTimeout(() => { if (S.ui.confirm === key) { S.ui.confirm = null; render(); } }, 3500);
  render(); return true;
}
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; return render(); }
  const set = e.target.closest("[data-set]"); if (set) return A.setSetting(set.dataset.set, JSON.parse(set.dataset.val));
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  if (t.dataset.act === "closeSheet" && e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  const act = t.dataset.act, u = S.ui;
  if (t.dataset.confirm && needConfirm(t, act + (t.dataset.id || ""))) return;
  try {
    switch (act) {
      case "menu": S.sheet = "menu"; render(); break;
      case "how": S.sheet = "how"; render(); break;
      case "closeSheet": S.sheet = null; render(); break;
      case "mute": Snd.muted = !Snd.muted; store.set("wts_muted", Snd.muted); render(); break;
      case "copy": try { await navigator.clipboard.writeText(t.dataset.copy); toast("Invite link copied"); } catch { toast("Couldn't copy — share the room code instead"); } break;
      case "start": await A.startGame(); break;
      case "toLobby": await A.toLobby(); break;
      case "pickSc": u.sc = +t.dataset.i; Snd.blip(); render(); break;
      case "pickSt": u.pick = +t.dataset.i; Snd.blip(); render(); break;
      case "lock": await A.lockAnswer(); break;
      case "peek": u.peek = !u.peek; render(); break;
      case "startVote": await A.startVote(); break;
      case "addTime": await A.addTime(); break;
      case "selVote": u.vote = inFS() ? t.dataset.v : +t.dataset.v; Snd.blip(); render(); break;
      case "submitVote": t.disabled = true; await A.submitVote(); break;
      case "force": await A.reveal(); break;
      case "next": await A.next(); break;
      case "restartRound": S.sheet = null; await A.restartRound(); break;
      case "kick": await A.kick(t.dataset.id); break;
      case "takeHost": await A.takeHost(); break;
      case "leave": await A.leave(); break;
      case "endSession": await A.endSession(); break;
    }
  } catch (err) { console.error(err); toast(/permission/i.test(String(err?.message)) ? "The game server denied access — check the Realtime Database rules." : "Something went wrong — try again"); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target; if (S.booting) return;
  const btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
  try {
    if (f.id === "hostForm") { const name = $("#hName").value.trim().slice(0, 16); if (!name) return toast("Enter a display name"); pidStore().set("wts_name", name); await A.createRoom(name); }
    if (f.id === "joinForm") {
      const name = $("#jName").value.trim().slice(0, 16), code = $("#jCode").value.trim();
      if (code.replace(/[^a-z]/gi, "").length !== 4) return toast("Room codes are 4 letters");
      if (!name) return toast("Enter a display name");
      pidStore().set("wts_name", name); await A.joinRoom(code, name);
    }
  } catch (err) { console.error(err); toast(/permission/i.test(String(err?.message)) ? "The game server denied access — check the Realtime Database rules." : "Couldn't reach the room — try again"); }
  finally { if (btn) btn.disabled = false; }
});

// Keep the screen awake while in a room (where supported)
let wake = null;
async function keepAwake() { try { if (S.code && "wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("click", keepAwake);

// =====================================================================
//  BOOT
// =====================================================================
(async function boot() {
  try { const m = /[?&]room=([A-Za-z]{4})\b/.exec(location.search); if (m) S.urlRoom = m[1].toUpperCase(); } catch {}
  render();
  const forceLocal = /[?&]local\b/.test(location.search);
  if (!forceLocal) {
    try { S.be = await makeFirebaseBackend(); S.be.onConn(v => { S.conn = v; const b = $("#connBanner"); if (b) { b.className = "banner " + (v ? "ok" : ""); b.textContent = connText(); } }); }
    catch (err) { console.warn("Firebase unavailable, using local demo mode:", err); }
  }
  if (!S.be) S.be = makeLocalBackend();
  S.pid = devicePid(); S.booting = false;
  setInterval(tick, 500);
  const ses = sess.get("wts_session");
  if (ses?.code && (!S.urlRoom || S.urlRoom === ses.code)) { // auto-rejoin after a refresh
    try {
      const room = await Promise.race([S.be.get(PUB(ses.code)), new Promise(r => setTimeout(() => r(null), 5000))]);
      if (room && realPlayers(room.players)[S.pid]) { enterRoom(ses.code); return; }
    } catch {}
    sess.del("wts_session");
  }
  render();
})();
window.__wts = { S, A, st, standings }; // handy for debugging from the console
</script>
</body>
</html>
